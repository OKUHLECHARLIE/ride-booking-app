<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Request a Ride</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <button id="logout-btn" type="button">Logout</button>
      <h1>RideBook</h1>

      

      <!-- Ride view sidebar content (hidden until Ride selected) -->
      <div id="ride-view" class="hidden">
        <button id="back-from-ride" class="back-btn">Back</button>
        <div class="search-container">
          <label for="location-search" class="search-label">Search location</label>
          <div class="search-row">
            <input id="location-search" type="text" placeholder="Search an address, street, or suburb..." />
            <button id="search-btn" type="button">Search</button>
          </div>
          <ul id="search-results" class="search-results hidden"></ul>
        </div>
        <p class="instruction" id="instruction">Click the map to set your pickup location</p>
        <div id="ride-controls" class="hidden">
          <button id="request-btn">Request Ride</button>
          <button id="reset-btn">Reset</button>
        </div>
        <h2>Requested Rides</h2>
        <ul id="rides-list"></ul>
      </div>

      <!-- History view sidebar (only back button) -->
      <div id="history-view" class="hidden">
        <button id="back-from-history" class="back-btn">Back</button>
      </div>
    </div>

    <!-- Main content area: #map is a direct child of #app and fills remaining space -->
    <div id="map">
      <div id="map-canvas"></div>
      <!-- Main menu shown immediately after login -->
      <div id="menu-view">
        <div class="menu-buttons">
          <button id="enter-ride" class="card" type="button">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13 L21 13"/><path d="M5 6 L7 6"/><path d="M17 6 L19 6"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
            <div class="card-title">Ride</div>
            <div class="card-desc">Book a new ride by placing pins or searching a location</div>
            <div class="card-link">Start a ride →</div>
          </button>
          <button id="enter-history" class="card" type="button">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-7"/><path d="M12 7v5l3 3"/></svg>
            <div class="card-title">History</div>
            <div class="card-desc">View your completed rides, distances, and prices</div>
            <div class="card-link">View history →</div>
          </button>
        </div>
      </div>
      <div id="history-main" class="hidden">
        <div class="history-panel">
          <h2>Ride History</h2>
          <ul id="history-list"></ul>
        </div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
